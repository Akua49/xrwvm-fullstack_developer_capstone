services:
  mongo_db:
    image: mongo:7
    volumes: ["mongo_data:/data/db"]
  api:
    build: ./server/database
    environment:
      MONGO_URL: mongodb://mongo_db:27017/dealershipsDB
    ports: ["3030:3030"]
    depends_on: [mongo_db]
  sentiment:
    build: ./server/djangoapp/microservices
    ports: ["5050:5050"]
  web:
    build: ./server
    ports: ["8000:8000"]
    environment:
      DATABASE_PATH: /data/db.sqlite3
      backend_url: http://api:3030
      sentiment_analyzer_url: http://sentiment:5050
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
    volumes: ["web_data:/data"]
    depends_on: [api, sentiment]
volumes:
  mongo_data:
  web_data:
