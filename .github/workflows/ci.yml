name: Test and build dealership application
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r server/requirements.txt
      - run: python manage.py test && python manage.py check
        working-directory: server
      - run: npm install --no-audit --no-fund && npm run build
        working-directory: server/frontend
      - run: docker build -t dealership-web ./server
      - run: docker build -t dealership-api ./server/database

